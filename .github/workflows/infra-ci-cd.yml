name: "Infrastructure CI/CD (Terraform & DevSecOps)"

on:
  push:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci-cd.yml'
      - 'devsecops/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra-ci-cd.yml'
      - 'devsecops/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ============================================================================
  # Stage 1: Static Analysis & Linting (TFLint, TFsec, Checkov)
  # ============================================================================
  security-and-linting:
    name: "DevSecOps IaC Security & Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: devsecops/.gitleaks.toml

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.0

      - name: Run TFLint
        run: |
          tflint --init --config devsecops/.tflint.hcl
          tflint --config devsecops/.tflint.hcl --recursive terraform/

      - name: Run TFsec Security Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true

      - name: Run Checkov IaC Security Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          directory: terraform
          config_file: devsecops/.checkov.yaml
          soft_fail: true

  # ============================================================================
  # Stage 2: Automated Validation (Terratest)
  # ============================================================================
  terratest-validation:
    name: "Automated Validation (Terratest)"
    needs: [security-and-linting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Run Terratest Specs
        run: |
          cd terraform/tests
          go test -v -timeout 15m || true

  # ============================================================================
  # Stage 3: Terraform Plan (Dev Environment)
  # ============================================================================
  terraform-plan:
    name: "Terraform Plan (Dev)"
    needs: [security-and-linting]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init

      - name: Terraform Plan
        id: plan
        run: |
          cd terraform/environments/dev
          terraform plan -no-color -out=tfplan
        continue-on-error: false

      - name: Post Plan to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan: ✅ Validated
            *Pushed by: @${{ github.actor }}*
            *Action: \`${{ github.event_name }}\`*
            
            Infrastructure changes planned for **Azure UK South (Dev)**.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  # ============================================================================
  # Stage 4: Terraform Apply (Auto for Develop/Main)
  # ============================================================================
  terraform-apply:
    name: "Terraform Apply (Dev)"
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init & Apply
        run: |
          cd terraform/environments/dev
          terraform init
          terraform apply -auto-approve
